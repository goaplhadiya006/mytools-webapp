{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="card narrow">
    <h2>Forgot Password</h2>
    <p class="muted">Enter your email and we'll send you a reset link.</p>
    <form id="forgotForm" method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" value="{{ email or '' }}">
            <span class="error-text" id="err_email">{{ errors.email if errors else '' }}</span>
        </div>
        <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>
    <p class="muted"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/validate.js') }}"></script>
<script>attachEmailOnlyValidation('forgotForm');</script>
{% endblock %}
