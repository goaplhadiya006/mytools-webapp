{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card narrow">
    <h2>Login</h2>
    {% if errors and errors.general %}
        <div class="flash flash-error">{{ errors.general }}</div>
    {% endif %}
    <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" value="{{ email or '' }}">
            <span class="error-text" id="err_email"></span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <span class="error-text" id="err_password"></span>
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
    <p class="muted">
        <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
    </p>
    <p class="muted">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign Up</a></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/validate.js') }}"></script>
<script>
    attachLoginValidation('loginForm');
</script>
{% endblock %}
